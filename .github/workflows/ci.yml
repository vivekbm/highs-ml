name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libomp for LightGBM (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Predictor embeddings suite
        env:
          KERAS_BACKEND: jax
        run: python tests/test_highs_ml.py

      - name: Decomposition presolver suite
        run: python tests/test_decomp.py

      - name: Dantzig-Wolfe suite
        run: python tests/test_dw.py

      - name: Branch-and-price and routing suite
        run: python tests/test_bp.py

      - name: Bilinear suite
        run: python tests/test_bilinear.py

      - name: Refinement framework suite
        run: python tests/test_refine.py

      - name: Regression suite
        run: python tests/test_regressions.py

      - name: Student enrollment example (gurobi_ml reproduction)
        env:
          KERAS_BACKEND: jax
        run: python examples/student_admission.py

  build:
    name: sdist/wheel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check distributions
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
